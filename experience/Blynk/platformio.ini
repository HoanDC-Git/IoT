; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6            ;DHT22 TEMPERATURE &HUMIDITY SENSOR
    blynkkk/Blynk @ ^1.3.2                          ;Blynk
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4        ;LCD
    adafruit/Adafruit SSD1306 @ ^2.5.13             ;OLED DISPLAY
    seeed-studio/Grove 4-Digit Display @ ^2.0.0     ;TM1637 7 SEGMENT DISPLAY
    adafruit/RTClib @ ^2.1.4                        ;TIMER